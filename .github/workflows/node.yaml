name: Build and Lint

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable corepack
        run: corepack enable
      # --immutable is what CI does implicitly anyway (Yarn turns it on when CI
      # is set); stating it means a lockfile that has drifted from package.json
      # fails here with an obvious message rather than a bare exit 1.
      - name: Install dependencies
        run: yarn install --immutable
      - name: Build
        run: yarn build
      - name: Lint
        run: yarn lint
